# Raspberry Pi : exécutable C++ de diagnostic, conteneur non privilégié.
# Usage : docker compose -f compose.local.yaml run --rm diagnostic-reseau IP_ORDINATEUR 5050
name: controle-acces-local
services:
  diagnostic-reseau:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    profiles: ["diagnostic"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: bridge

  cache-sqlite:
    build:
      context: .
      dockerfile: docker/Dockerfile.local
    image: controle-acces-local-diagnostic-reseau:latest
    profiles: ["sqlite"]
    entrypoint: ["/usr/local/bin/controle-local"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - donnees_locales:/donnees

  importer-sqlite:
    image: controle-acces-local-diagnostic-reseau:latest
    profiles: ["synchronisation"]
    entrypoint: ["python3", "/usr/local/bin/importer-snapshot.py"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - donnees_locales:/donnees

  surveillance-cache:
    image: controle-acces-local-diagnostic-reseau:latest
    profiles: ["surveillance"]
    entrypoint: ["python3", "/usr/local/bin/surveiller-cache.py"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    volumes:
      - donnees_locales:/donnees:ro
      - ./configuration/politique-synchronisation.json:/etc/controle-acces/politique-synchronisation.json:ro

  journal-evenements:
    build:
      context: .
      dockerfile: docker/Dockerfile.journal
    image: controle-acces-journal:local
    profiles: ["journal"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - journal_evenements:/donnees

  journal-https:
    build:
      context: .
      dockerfile: docker/Dockerfile.journal
    image: controle-acces-journal:local
    profiles: ["journal-https"]
    entrypoint: ["python3", "-B", "/opt/controle-acces/serveur-local/journal-https.py"]
    command: []
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    restart: "no"
    ports:
      - "192.168.81.1:8443:8443"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    volumes:
      - journal_evenements:/donnees
      - /etc/controle-acces/journal-pki:/run/journal-pki:ro
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

volumes:
  donnees_locales:
  journal_evenements:

