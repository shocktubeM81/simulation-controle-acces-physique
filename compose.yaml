# Premier laboratoire API : PostgreSQL s'exécute sur l'hôte Ubuntu.
# L'API n'écoute que sur 127.0.0.1, pas sur le réseau local.
services:
  interface-api:
    image: postgrest/postgrest:v16.3
    network_mode: host
    env_file:
      - .env.api
    environment:
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: api_anonyme
      PGRST_SERVER_HOST: 127.0.0.1
      PGRST_SERVER_PORT: "3000"
    restart: unless-stopped
